name: homemate_mobile
description: HomeMate Africa — the customer app for finding, viewing and renting a home.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # Material's own strings (date pickers, text selection) in Kiswahili as well
  # as English; the app's own strings are in lib/core/i18n.
  flutter_localizations:
    sdk: flutter

  # State: Riverpod throughout, so a screen never owns its own fetching.
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing, with the auth redirect in one place.
  go_router: ^14.6.2

  http: ^1.2.2
  # Sessions survive a restart; the PIN never touches storage.
  shared_preferences: ^2.3.3
  intl: ^0.20.3
  # OpenStreetMap, per the design — no proprietary map SDK.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # "Near me" needs a position and, more importantly, an honest answer about
  # whether we are allowed one — geolocator distinguishes "denied", "denied
  # forever" and "location is switched off", which are three different screens.
  geolocator: ^14.0.3
  cached_network_image: ^3.4.1
  # Identity documents and the profile photo (CUS-008b) come from the camera or
  # the gallery; the bytes go straight to the API, never to a third party.
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/
