name: CI

# Every push and pull request: static analysis, the widget tests, and the
# release web build (the PWA Firebase Hosting serves), pointed at production
# through the tracked .env.prod.json. The build is uploaded as an artifact so
# a green run is a deployable `build/web`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build web (release)
        run: flutter build web --release --dart-define-from-file=.env.prod.json

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7
